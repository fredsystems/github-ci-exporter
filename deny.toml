# configuration for https://github.com/EmbarkStudios/cargo-deny

[licenses]
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "BSL-1.0",
  # webpki-roots ships the Mozilla CA bundle, which is data rather than code
  # and is distributed under the Community Data License Agreement. Permissive
  # and OSI-compatible for redistribution.
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
version = 2
confidence-threshold = 0.8

[advisories]
version = 2
ignore = [
  # unsafe-libyaml is unmaintained (informational, not a vulnerability) and
  # comes in via serde_yaml_ng 0.10.0, the latest release, so there is no
  # update that clears it. Remove once we migrate off serde_yaml_ng:
  # https://github.com/fredsystems/github-ci-exporter/issues/28
  { id = "RUSTSEC-2024-0449", reason = "unmaintained, no patched serde_yaml_ng; tracked in #28" },
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
